<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><meta name="referrer" content="no-referrer"><title>USDT-QX · 登录安全</title><link rel="stylesheet" href="/qx-rate-guard.css"><link rel="stylesheet" href="/qx-security.css"><script type="module" src="/qx-security.js"></script></head><body><main>
<header><a href="/account/password" data-i18n="back">← 返回账号设置</a><button id="language" type="button">English</button></header>
<div class="heading"><div><p class="eyebrow">USDT-QX</p><h1 data-i18n="title">登录安全</h1><p class="muted" id="account"></p></div><span class="badge" id="status">—</span></div>
<div id="notice" role="status" aria-live="polite"></div>
<section class="card"><h2 data-i18n="authenticator">验证器两步验证</h2><p class="muted" data-i18n="intro">启用后，登录需要密码和验证器验证码。支持 Google Authenticator、Microsoft Authenticator 等标准 TOTP 验证器。</p>
<form id="security-form"><div class="grid"><label><span data-i18n="password">当前密码</span><input name="password" type="password" autocomplete="current-password" maxlength="72" required></label><label id="code-field" hidden><span data-i18n="code">验证码或恢复码</span><input name="code" autocomplete="one-time-code" maxlength="64"></label></div>
<div id="enrollment" hidden><h3 data-i18n="scan">使用验证器扫描二维码</h3><img id="qr" class="security-qr" alt="Authenticator QR code"><p class="muted" data-i18n="manual">也可手动输入以下密钥。完成验证码验证后才会启用。</p><p id="secret" class="security-secret"></p><p id="setup-expiry" class="muted"></p></div>
<p id="remaining" class="muted"></p>
<div class="security-actions"><button id="setup" type="submit" value="setup" class="primary" data-i18n="setup">开始绑定验证器</button><button id="enable" type="submit" value="enable" class="primary" hidden data-i18n="enable">确认启用</button><button id="rotate" type="submit" value="recovery-codes" hidden data-i18n="rotate">重新生成恢复码</button><button id="disable" type="submit" value="disable" hidden data-i18n="disable">关闭两步验证</button></div></form></section>
<section class="card" id="recovery" hidden><h2 data-i18n="recoveryTitle">保存一次性恢复码</h2><p class="warning" data-i18n="recoveryNote">这些恢复码只在此时显示。请保存到密码管理器；每个码只能使用一次。重新生成会使旧恢复码失效。</p><div id="codes" class="recovery-list"></div><div class="security-actions"><button id="copy" type="button" data-i18n="copy">复制恢复码</button><button id="saved" type="button" data-i18n="saved">我已保存，隐藏恢复码</button></div></section>
<section class="card"><h2 data-i18n="sessions">登录会话</h2><p class="muted" data-i18n="sessionNote">改密码会撤销全部旧登录；绑定、关闭两步验证或更新恢复码后，为当前浏览器更新登录。此处退出会让所有设备重新登录。</p><button id="logout" type="button" data-i18n="logout">退出所有设备</button></section>
</main></body></html>
